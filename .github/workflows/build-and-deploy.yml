# Builds the firmware with PlatformIO every time you push to "main",
# then publishes the web installer (site/) plus the freshly built firmware
# to GitHub Pages.
name: Build firmware and deploy web installer

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Build the firmware and merge it into one flashable image
        run: bash tools/build-merged.sh _site/firmware.bin

      - name: Assemble the web page
        run: |
          cp site/index.html site/manifest.json _site/
          VER=$(grep -oP '#define FW_VERSION "\K[^"]+' src/main.cpp)
          if [ -z "$VER" ]; then echo "FW_VERSION not found in src/main.cpp"; exit 1; fi
          echo "Firmware version $VER"
          sed -i "s/__VERSION__/$VER (build ${GITHUB_SHA::7})/" _site/manifest.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
