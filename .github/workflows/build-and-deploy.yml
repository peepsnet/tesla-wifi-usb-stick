# Builds the firmware with PlatformIO every time you push to "main",
# then publishes the web installer (site/) plus the freshly built firmware
# to GitHub Pages.
name: Build firmware and deploy web installer

on:
  push:
    branches: [main]
  workflow_dispatch:          # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO downloads
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio "esptool==4.8.1"

      - name: Build the firmware
        run: pio run

      - name: List build output
        run: ls -la .pio/build/t-dongle-s3

      - name: Merge into one flashable image
        run: |
          BOOT_APP0=$(find ~/.platformio -name boot_app0.bin | head -n 1)
          if [ -z "$BOOT_APP0" ]; then echo "boot_app0.bin not found"; exit 1; fi
          mkdir -p _site
          esptool.py --chip esp32s3 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            -o _site/firmware.bin \
            0x0     .pio/build/t-dongle-s3/bootloader.bin \
            0x8000  .pio/build/t-dongle-s3/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/t-dongle-s3/firmware.bin
          ls -la _site/firmware.bin
          python3 - <<'PY'
          d = open("_site/firmware.bin", "rb").read()
          assert len(d) > 0xE000, "firmware.bin is too small"
          assert set(d[0xD000:0xE000]) == {0xFF}, "cfg area is not blank - check partitions.csv"
          print("cfg area is blank, OK")
          PY

      - name: Assemble the web page
        run: |
          cp site/index.html site/manifest.json _site/
          sed -i "s/__VERSION__/${GITHUB_SHA::7}/" _site/manifest.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
