; Wi-Fi USB Stick - ESP32-S3 (LilyGo T-Dongle S3 by default)
;
; The stock "espressif32" platform still ships Arduino-ESP32 2.x, which lacks
; SD_MMC.readRAW/writeRAW. pioarduino provides core 3.x.
;
; The release is pinned (55.03.35) because the newer "stable" builds refuse to
; install on some PlatformIO Core versions (IncompatiblePlatform error).

[env:t-dongle-s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    -UARDUINO_USB_MODE            ; drop the board's default so the next line doesn't clash
    -DARDUINO_USB_MODE=0          ; native USB as OTG/TinyUSB (needed for USBMSC)
    -DARDUINO_USB_CDC_ON_BOOT=0   ; no USB serial; the port is the "drive"
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX@^1.2.0    ; T-Dongle S3 LCD

monitor_speed = 115200
